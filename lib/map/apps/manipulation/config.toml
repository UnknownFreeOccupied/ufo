[map]
# Resolution of the map in meters
resolution = 0.005

[integrator]
# In degrees
angular_resolution = 1.0
# Distance in meters
min_distance = 0.0
# Distance in meters
max_distance = 10.0
# In degrees
sensor_angular_resolution = 0.0
# In meters
translation_error = 0.0
# In degrees
orientation_error = 0.0
# Probability [0, 1], should be over 0.5 to increase occupancy
occupancy_hit = 0.9
# Probability [0, 1], should be below 0.5 to decrease occupancy
occupancy_miss = 0.45

[renderer]
named_pipe = false
output_dir = "/home/dduberg/Downloads/manipulation/src/ufo/lib/map/apps/manipulation/renders"
# Pixels
width = 160 # 1024
# Pixels
height = 160 # 1024
# Meters
elevation = 5.0
# World coordinates (meters)
# top_left = [-1.551736831665039, -1.8933748006820679]
top_left = [-2.5, 2.5]
# World coordinates (meters)
# top_right = [-1.5295567512512207, 2.2491567134857178]
top_right = [2.5, 2.5]
# World coordinates (meters)
# bottom_right = [1.3992540836334229, 2.3145055770874023]
bottom_right = [2.5, -2.5]
# World coordinates (meters)
# bottom_left = [1.8644652366638184, -1.8594151735305786]
bottom_left = [-2.5, -2.5]
# Distance in meters
near_clip = 0.01
# Distance in meters
far_clip = 4.8
# Red, Green, Blue components in range [0..255]
# background_color = [0, 32, 255]
background_color = [117, 117, 117]


